<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>家計簿&amp;目標管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ✅ ログイン画面 -->
  <div id="login-section">
    <h2>ログイン</h2>
    <input type="email" id="loginEmail" placeholder="メールアドレス" autocomplete="email"><br>
    <input type="password" id="loginPassword" placeholder="パスワード" autocomplete="current-password"><br>
    <button id="signupBtn">新規登録</button>
    <button id="loginBtn">ログイン</button>
    <p id="loginStatus"></p>
  </div>

  <!-- ✅ ログイン後だけ表示されるメイン画面 -->
  <div id="mainApp" style="display:none;">
    <h1>家計簿&amp;目標管理</h1>

    <!-- 今ある家計簿の各セクション -->
    <section id="goal-section">
      <h2>目標設定</h2>
      <button type="button" data-toggle="goalInput">目標表示 / 非表示</button>
      <div id="goalInput" style="display:none;">
        
        <div class="input-group">
          <label for="goalName">目標名：</label>
          <input type="text" id="goalName" placeholder="例: 海外旅行" maxlength="100">
        </div>

        <div class="input-group">
          <label for="goalAmount">目標金額 (円)：</label>
          <input type="number" id="goalAmount" placeholder="例: 300000" min="1" max="100000000000">
        </div>

        <div class="input-group">
          <label for="goalPeriod">期間 (年)：</label>
          <input type="number" id="goalPeriod" placeholder="例: 2" min="1" max="100">
        </div>

        <button type="button" id="setGoalBtn">設定</button>
        <p id="goalDisplay">目標未設定</p>

        <div id="progressBar"><div id="progress"></div></div>
      </div>
    </section>

    <section id="input-section">
      <h2>収支入力</h2>
      <button type="button" data-toggle="input">収支入力表示 / 非表示</button>
      <div id="input" style="display:none;">

        <div class="input-group">
          <label for="genre">ジャンル：</label>
          <select id="genre"></select>
        </div>

        <div class="input-group">
          <label for="type">区分：</label>
          <select id="type">
            <option value="income">収入</option>
            <option value="expense">支出</option>
          </select>
        </div>

        <div class="input-group">
          <label for="amount">金額 (円)：</label>
          <input type="number" id="amount" placeholder="例: 5000" min="1" max="100000000000">
        </div>

        <div class="input-group">
          <label for="memo">メモ：</label>
          <input type="text" id="memo" placeholder="任意" maxlength="200">
        </div>

        <button type="button" id="addEntryBtn">追加</button>
        <hr>

        <div class="input-group">
          <label for="newGenre">新しいジャンル：</label>
          <input type="text" id="newGenre" placeholder="例: 趣味" maxlength="50">
        </div>

        <button type="button" id="addGenreBtn">ジャンル追加</button>

        <div id="genreControl">
          <select id="genreSelect"></select>
          <button type="button" id="editGenreBtn">編集</button>
          <button type="button" id="deleteGenreBtn">削除</button>
        </div>
      </div>
    </section>

    <section id="calculator-section">
      <h2>計算ツール</h2>
      <button type="button" id="toggleCalculatorBtn">計算ツール表示 / 非表示</button>

      <div class="calculator-column">
        <div id="calculatorInput" style="display:none;">
          <div class="calculator">
            <input id="display" type="text" value="0" readonly>

            <div class="push">
              <button type="button" data-calc-action="clear">C</button>
              <button type="button" data-calc-action="backspace">←</button>
              <button type="button" data-calc-key="/">÷</button>
              <button type="button" data-calc-key="*">×</button>

              <button type="button" data-calc-key="7">7</button>
              <button type="button" data-calc-key="8">8</button>
              <button type="button" data-calc-key="9">9</button>
              <button type="button" data-calc-key="-">-</button>

              <button type="button" data-calc-key="4">4</button>
              <button type="button" data-calc-key="5">5</button>
              <button type="button" data-calc-key="6">6</button>
              <button type="button" data-calc-key="+">+</button>

              <button type="button" data-calc-key="1">1</button>
              <button type="button" data-calc-key="2">2</button>
              <button type="button" data-calc-key="3">3</button>
              <button type="button" data-calc-action="calculate">=</button>

              <button type="button" data-calc-key="0" class="zero">0</button>
              <button type="button" data-calc-key=".">.</button>
            </div>
          </div>

          <div id="calc-history">
            <h3>履歴</h3>
            <div id="history-list"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="investment-section">
      <h2>積立投資シミュレーション</h2>
      <button type="button" data-toggle="investmentInput">積み立て投資表示 / 非表示</button>
      
      <div id="investmentInput" class="section-inputs" style="display:none;">
        <div class="input-group">
          <label for="investMode">計算モード</label>
          <select id="investMode">
            <option value="normal">積立総額を求める</option>
            <option value="target">目標金額を達成するための毎月投資額</option>
            <option value="period">目標金額を達成するための積立期間</option>
          </select>
        </div>

        <div class="input-group">
          <label for="initialInvestment">初期投資額(円)</label>
          <input type="number" id="initialInvestment" placeholder="例: 100000" min="0">
        </div>

        <div class="input-group">
          <label for="monthlyInvestment">毎月の積立額(円)</label>
          <input type="number" id="monthlyInvestment" placeholder="例: 10000" min="0">
        </div>

        <div class="input-group">
          <label for="years">積立年数(年)</label>
          <input type="number" id="years" placeholder="例: 10" min="1" max="100">
        </div>

        <div class="input-group hidden" id="targetFields">
          <label for="targetAmount">目標金額(円)</label>
          <input type="number" id="targetAmount" placeholder="例: 1000000" min="1">
        </div>

        <div class="input-group">
          <label for="annualRate">想定年利(%)</label>
          <input type="number" id="annualRate" placeholder="例: 5" min="0" max="100" step="0.1">
        </div>

        <div class="input-group">
          <label for="riskRate">想定リスク(%)</label>
          <input type="number" id="riskRate" placeholder="例: 2" min="0" max="100" step="0.1">
        </div>

        <button type="button" id="simulateInvestmentBtn">計算</button>

        <div id="investmentResult" class="result-box"></div>
      </div>
    </section>

    <section id="compare-section">
      <h2>比較・差額シミュレーション</h2>
      <button type="button" data-toggle="compareInputs">比較・差額表示 / 非表示</button>
      <div id="compareInputs" style="display:none;">
        <div class="input-group">
          <label for="compareGenre">モード選択:</label>
          <select id="compareGenre">
            <option value="生活費">生活費</option>
            <option value="副業">副業</option>
            <option value="ポイ活">ポイ活</option>
            <option value="投資">投資</option>
          </select>
          <label for="investmentMode">運用頻度：</label>
          <select id="investmentMode">
            <option value="once">1回のみ</option>
            <option value="monthly">毎月積立</option>
            <option value="yearly">年1回積立</option>
          </select>
        </div>

        <div class="input-group">
          <label for="aAmount">Aプラン金額 (円):</label>
          <input type="number" id="aAmount" placeholder="例: 50000" min="0">
        </div>

        <div class="input-group">
          <label for="bAmount">Bプラン金額 (円):</label>
          <input type="number" id="bAmount" placeholder="例: 40000" min="0">
        </div>

        <div class="input-group">
          <label id="compareYearsLabel" for="compareYears">期間 (年):</label>
          <input type="number" id="compareYears" placeholder="例: 5" min="1" max="100">
        </div>

        <div id="interestFields" style="display:none;">
          <div class="input-group">
            <label for="aRate">Aプラン利率 (%):</label>
            <input type="number" id="aRate" placeholder="例: 5" min="0" max="100" step="0.1">
          </div>
          <div class="input-group">
            <label for="bRate">Bプラン利率 (%):</label>
            <input type="number" id="bRate" placeholder="例: 2" min="0" max="100" step="0.1">
          </div>
        </div>

        <button type="button" id="calculateCompareBtn">計算</button>
        <div id="differenceResult"></div>
      </div>
    </section>

    <section id="list-section">
      <h2>履歴</h2>
      <button type="button" data-toggle="entryLists">履歴表示 / 非表示</button>
      <div id="entryLists" style="display:none;"></div>
    </section>

    <section id="summary-section">
      <h2>集計</h2>
      <p>合計収入: <span id="totalIncome">0</span> 円</p>
      <p>合計支出: <span id="totalExpense">0</span> 円</p>
      <p>残高: <span id="balance">0</span> 円</p>
      <p>目標達成率: <span id="goalRate">0</span>%</p>
    </section>

    <div id="logout-section">
      <button type="button" id="logoutBtn">ログアウト</button>
    </div>
  </div>

  <!-- トースト通知 -->
  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <script type="module" src="script.js"></script>
</body>
</html>
